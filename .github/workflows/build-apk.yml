name: Build Docsy APK

# Upload (commit) a project .zip to the repo, or push the project files directly.
# This workflow unzips the newest uploaded zip, builds signed APKs and publishes them
# as a GitHub Release + workflow artifacts.
on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-from-zip.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find project (unzip if a zip was uploaded)
        run: |
          set -e
          ZIP=$(git log -1 --name-only --pretty=format: -- '*.zip' | grep -m1 '\.zip$' || true)
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            echo "Using zip: $ZIP"
            rm -rf _proj && mkdir _proj
            unzip -q "$ZIP" -d _proj
            G=$(find _proj -name gradlew | head -n1)
            [ -n "$G" ] || { echo "No gradlew found inside $ZIP"; exit 1; }
            echo "PROJ=$(dirname "$G")" >> "$GITHUB_ENV"
          elif [ -f gradlew ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            echo "No zip and no project at repo root"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key (from repository secrets)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/docsy-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/docsy-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - release APK will be debug-signed"
          fi

      - name: Build release + debug APK
        working-directory: ${{ env.PROJ }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp "$PROJ"/app/build/outputs/apk/release/*.apk out/Docsy-release.apk
          cp "$PROJ"/app/build/outputs/apk/debug/*.apk out/Docsy-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Docsy-APKs
          path: out/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --title "Docsy build ${{ github.run_number }}" \
            --notes "Signed release APK (Docsy-release.apk) and debug APK."
